<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FiverrGrowth Safe Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background: #fafafa;
      color: #222325;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #efeff0;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 14px;
      font-weight: 700;
      color: #222325;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #1dbf73;
      border-radius: 50%;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      background: #e8faf2;
      color: #107a48;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #b7eed3;
    }
    .card {
      background: white;
      border: 1px solid #dadbdd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #74767e;
      margin-bottom: 6px;
    }
    .card-val {
      font-size: 18px;
      font-weight: 800;
      color: #222325;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #404145;
      margin-top: 4px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: #1dbf73;
      color: white;
      text-align: center;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background: #19a463; }
    .btn-secondary {
      display: block;
      width: 100%;
      background: white;
      color: #222325;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #dadbdd;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-secondary:hover { background: #f5f5f5; }
    .footer-note {
      font-size: 10px;
      color: #74767e;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="dot"></div>
      <span>FiverrGrowth</span>
    </div>
    <div class="status-badge" id="conn-status">Safe Zone Active</div>
  </div>

  <div class="card">
    <div class="card-title">Active Inbound Briefs</div>
    <div class="card-val" id="briefs-count">Live Sync Ready</div>
    <div class="info-row">
      <span>Anti-Ban Safety Gap:</span>
      <strong>25s human jitter</strong>
    </div>
    <div class="info-row">
      <span>Execution Session:</span>
      <strong>Home Residential IP</strong>
    </div>
  </div>

  <button class="btn-primary" id="open-dashboard-btn">Open Briefs Command Center ↗</button>
  <button class="btn-secondary" id="sync-active-tab-btn">Sync Active Fiverr Tab</button>

  <p class="footer-note">🛡️ Zero-ban protocol active. Uses natural browser session.</p>

  <script src="popup.js"></script>
</body>
</html>
